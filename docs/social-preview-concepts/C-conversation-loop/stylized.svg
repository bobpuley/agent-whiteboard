<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- loop path -->
  <path d="M 460 320 A 180 180 0 1 1 820 320 A 180 180 0 1 1 460 320" fill="none" stroke="#2980b9" stroke-width="4" stroke-dasharray="1 14" stroke-linecap="round"/>

  <!-- terminal glyph (agent), left of the loop -->
  <g transform="translate(400,320)">
    <rect x="-70" y="-46" width="140" height="92" rx="14" fill="#1a1a1a"/>
    <text x="-42" y="8" font-family="'Cascadia Code', Consolas, monospace" font-size="30" fill="#7fdbca">&gt;_</text>
  </g>

  <!-- graph glyph (canvas), right of the loop -->
  <g transform="translate(880,320)">
    <rect x="-70" y="-46" width="140" height="92" rx="14" fill="#e8f4fd" stroke="#2980b9" stroke-width="3"/>
    <circle cx="-30" cy="-12" r="9" fill="#2980b9"/>
    <circle cx="20" cy="10" r="9" fill="#2980b9"/>
    <circle cx="-8" cy="26" r="9" fill="#2980b9"/>
    <path d="M -30 -12 L 20 10 L -8 26" fill="none" stroke="#2980b9" stroke-width="3"/>
  </g>

  <!-- cursor/click glyph, top of the loop -->
  <g transform="translate(640,120)">
    <circle r="34" fill="#f5a623"/>
    <path d="M -10 -12 l 0 26 l 7 -6 l 5 11 l 6 -3 l -5 -11 l 9 -1 z" fill="#1a1a1a"/>
  </g>

  <!-- arrowheads on the loop to show direction -->
  <path d="M 780 160 l 14 -4 l -2 15 z" fill="#2980b9"/>
  <path d="M 500 480 l -14 4 l 2 -15 z" fill="#2980b9"/>

  <text x="640" y="130" text-anchor="middle" font-size="0"></text>

  <text x="640" y="560" text-anchor="middle" font-size="40" font-weight="700" fill="#1a1a1a">agent-whiteboard</text>
  <text x="640" y="592" text-anchor="middle" font-size="19" fill="#999999">Renders. You click. It adapts.</text>
</svg>
