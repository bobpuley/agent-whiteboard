<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- faint context nodes, hinting a bigger diagram -->
  <g opacity="0.35">
    <rect x="140" y="80" width="180" height="60" rx="10" fill="#e8f4fd" stroke="#2980b9" stroke-width="2"/>
    <text x="230" y="116" text-anchor="middle" font-size="17" fill="#1a1a1a" font-weight="600">Overview</text>
    <rect x="190" y="500" width="180" height="60" rx="10" fill="#e8f4fd" stroke="#2980b9" stroke-width="2"/>
    <text x="280" y="536" text-anchor="middle" font-size="17" fill="#1a1a1a" font-weight="600">Failover</text>
    <path d="M 260 140 L 300 260" stroke="#aaaaaa" stroke-width="2"/>
    <path d="M 320 380 L 300 500" stroke="#aaaaaa" stroke-width="2"/>
  </g>

  <!-- the node the user is acting on -->
  <rect x="150" y="255" width="340" height="120" rx="16" fill="#2980b9"/>
  <text x="320" y="325" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">Leader Election</text>

  <!-- connector to the agent-generated action menu -->
  <path d="M 490 300 C 520 290, 540 285, 566 280" fill="none" stroke="#2980b9" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- popup card -->
  <rect x="566" y="176" width="360" height="228" rx="16" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  <text x="596" y="216" font-size="14" fill="#999999" letter-spacing="0.5">AVAILABLE ACTIONS</text>
  <line x1="566" y1="232" x2="926" y2="232" stroke="#eeeeee" stroke-width="2"/>

  <rect x="566" y="232" width="360" height="56" fill="#ffffff"/>
  <circle cx="602" cy="260" r="5" fill="#2980b9"/>
  <text x="622" y="266" font-size="19" fill="#1a1a1a">Explain this step</text>

  <rect x="566" y="288" width="360" height="56" fill="#e8f4fd"/>
  <circle cx="602" cy="316" r="5" fill="#2980b9"/>
  <text x="622" y="322" font-size="19" fill="#1a1a1a" font-weight="700">Zoom in</text>

  <rect x="566" y="344" width="360" height="56" fill="#ffffff"/>
  <circle cx="602" cy="372" r="5" fill="#2980b9"/>
  <text x="622" y="378" font-size="19" fill="#1a1a1a">Quiz me</text>

  <line x1="566" y1="288" x2="926" y2="288" stroke="#eeeeee" stroke-width="2"/>
  <line x1="566" y1="344" x2="926" y2="344" stroke="#eeeeee" stroke-width="2"/>

  <!-- spark badge: the agent decided what's in this menu -->
  <g transform="translate(902,196)">
    <path d="M 0 -17 C 3 -5 5 -3 17 0 C 5 3 3 5 0 17 C -3 5 -5 3 -17 0 C -5 -3 -3 -5 0 -17 Z" fill="#f5a623"/>
  </g>

  <!-- cursor over the highlighted row -->
  <path d="M 812 300 l 0 46 l 12 -11 l 9 20 l 11 -5 l -9 -20 l 16 -2 z" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>

  <text x="640" y="560" text-anchor="middle" font-size="36" font-weight="700" fill="#1a1a1a">agent-whiteboard</text>
  <text x="640" y="590" text-anchor="middle" font-size="18" fill="#999999">The agent decides what you can do next</text>
</svg>
