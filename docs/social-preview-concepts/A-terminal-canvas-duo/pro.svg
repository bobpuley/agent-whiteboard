<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef3f7"/>
    </linearGradient>
    <linearGradient id="termGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232323"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a9bd8"/>
      <stop offset="1" stop-color="#1f6699"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0a2540" flood-opacity="0.18"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0a2540" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Terminal panel -->
  <g filter="url(#softShadow)">
    <rect x="90" y="150" width="480" height="360" rx="20" fill="url(#termGrad)"/>
  </g>
  <rect x="90" y="150" width="480" height="46" rx="20" fill="#1f1f1f"/>
  <rect x="90" y="180" width="480" height="16" fill="#1f1f1f"/>
  <circle cx="124" cy="173" r="7" fill="#ff5f57"/>
  <circle cx="150" cy="173" r="7" fill="#febc2e"/>
  <circle cx="176" cy="173" r="7" fill="#28c840"/>

  <text x="120" y="245" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="19" fill="#6ee7d0">$ npx agent-whiteboard</text>
  <text x="120" y="283" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="16" fill="#8a8a8a">agent-whiteboard running at :3000 ✓</text>
  <text x="120" y="333" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="19" fill="#f2f2f2">&gt; render(mermaid, "Step B")</text>
  <rect x="120" y="348" width="11" height="22" fill="#6ee7d0" opacity="0.9"/>

  <!-- glassy control-flow connector -->
  <path d="M 578 328 C 615 300, 635 262, 656 232" fill="none" stroke="#2980b9" stroke-width="3" stroke-dasharray="1 9" stroke-linecap="round" opacity="0.8"/>
  <circle cx="656" cy="232" r="5" fill="#2980b9"/>

  <!-- Canvas panel -->
  <g filter="url(#cardShadow)">
    <rect x="660" y="108" width="530" height="424" rx="20" fill="#ffffff"/>
  </g>
  <rect x="660" y="108" width="530" height="6" rx="3" fill="#2980b9"/>

  <rect x="705" y="166" width="150" height="58" rx="12" fill="#eef6fc" stroke="#cfe6f5" stroke-width="1.5"/>
  <text x="780" y="201" text-anchor="middle" font-size="18" fill="#1a1a1a" font-weight="600">Start</text>

  <rect x="705" y="281" width="150" height="58" rx="12" fill="#eef6fc" stroke="#cfe6f5" stroke-width="1.5"/>
  <text x="780" y="316" text-anchor="middle" font-size="18" fill="#1a1a1a" font-weight="600">Step A</text>

  <g filter="url(#cardShadow)">
    <rect x="925" y="278" width="172" height="64" rx="14" fill="url(#nodeGrad)"/>
  </g>
  <text x="1011" y="317" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="700">Step B</text>

  <rect x="800" y="412" width="150" height="58" rx="12" fill="#eef6fc" stroke="#cfe6f5" stroke-width="1.5"/>
  <text x="875" y="447" text-anchor="middle" font-size="18" fill="#1a1a1a" font-weight="600">Step C</text>

  <path d="M 780 224 L 780 281" fill="none" stroke="#b9c2ca" stroke-width="2.5"/>
  <path d="M 780 276 l -6 -12 l 12 0 z" fill="#b9c2ca"/>
  <path d="M 855 310 L 925 310" fill="none" stroke="#b9c2ca" stroke-width="2.5"/>
  <path d="M 920 310 l -12 -6 l 0 12 z" fill="#b9c2ca"/>
  <path d="M 972 342 C 950 375, 918 396, 898 412" fill="none" stroke="#b9c2ca" stroke-width="2.5"/>
  <path d="M 900 407 l -14 8 l 14 6 z" fill="#b9c2ca"/>

  <!-- refined cursor -->
  <g filter="url(#cardShadow)">
    <path d="M 1057 350 l 0 44 l 11 -10 l 9 19 l 11 -5 l -9 -19 l 16 -2 z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  </g>

  <text x="640" y="580" text-anchor="middle" font-size="38" font-weight="700" fill="#12212e" letter-spacing="0.3">agent-whiteboard</text>
  <text x="640" y="611" text-anchor="middle" font-size="18" fill="#5b6b78">AI teacher agents, on a second screen</text>
</svg>
